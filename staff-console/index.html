<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PTTEP Booth Console</title>
<script>document.body.dataset.app="staff"</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap">
<style>
/* Layout: prototype strip, then either the visitor web app (mobile column, bottom tabs) or the staff console (wide). Visitor app: liquid glass over PTTEP blues with stacked zone cards; console: white ground, square corners. PTTEP logo, Kanit, cyan accent. */
:root{
  --white:#FFFFFF; --mist:#F3F7FB; --sky:#E1EEF9; --navy:#001736; --ocean:#194776;
  --ink:#001736; --ink-muted:rgba(0,23,54,0.68); --line:rgba(0,23,54,0.12); --line-strong:rgba(0,23,54,0.28);
  --energy:#00DAFF; --accent:#194776; --hot:#B25E00; --warm:#194776; --cold:rgba(0,23,54,0.55);
  --sans:"Kanit",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--energy);outline-offset:2px}
h1,h2,h3{font-weight:600;margin:0;text-wrap:balance}
h1{font-size:22px;line-height:1.15}
h2{font-size:18px;line-height:1.2}
h3{font-size:15px;line-height:1.25}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.small{font-size:12px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:400}


/* ---------- visitor app: liquid glass over PTTEP blues, zones as stacked cards ---------- */
.app{--glass:rgba(255,255,255,.44);--glass-edge:rgba(255,255,255,.72);--glass-sh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.3),0 10px 30px rgba(0,23,54,.12);--sheen:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 42%);--red:#ED1C24;
  max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;isolation:isolate;
  background:radial-gradient(70% 38% at 0% 0%,rgba(0,218,255,.38),transparent 70%),radial-gradient(60% 34% at 100% 22%,rgba(25,71,118,.3),transparent 70%),radial-gradient(80% 40% at 50% 100%,rgba(0,174,239,.3),transparent 70%),#EDF5FB}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--glass-sh)}
.app :focus-visible{outline:2px solid var(--red);outline-offset:3px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding-block:12px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 8px;border-radius:999px}
.appbar .logo{height:30px;width:auto;display:block}
.appbar .ev{font-size:11px;letter-spacing:.04em;color:var(--ink-muted);line-height:1.15}
.appbar .me{margin-left:auto;width:44px;height:44px;border-radius:50%;padding:3px;cursor:pointer}
.appbar .me img{width:100%;height:100%}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{font-size:40px;line-height:1;letter-spacing:-.02em;font-weight:600}
.hero.xl{font-size:54px;line-height:.95}
.lede{font-size:18px;font-weight:400;margin-top:-6px}
.meta{font-size:13px;color:var(--ink-muted);margin-top:10px}
.chip{align-self:flex-start;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:400}
.btn{display:block;width:100%;padding:13px 14px;background:var(--energy);color:var(--ink);border:0;font-weight:600;font-size:15px;cursor:pointer;text-align:center}
.btn:disabled{background:var(--mist);color:var(--ink-muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);font-weight:400}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;white-space:nowrap}
.app .btn{border-radius:999px;background:var(--navy);color:var(--white);font-weight:400;padding:14px 20px;box-shadow:0 8px 20px rgba(0,23,54,.25)}
.app .btn:disabled{background:rgba(255,255,255,.5);color:var(--ink-muted);box-shadow:none}
.app .btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--glass-edge);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.actions{position:sticky;bottom:0;padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;margin:0 16px 12px;border-radius:999px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:6px}
.tabbar button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer;color:var(--ink-muted);border-radius:999px}
.tabbar button[aria-current="page"]{color:var(--ink);background:rgba(255,255,255,.7);font-weight:400}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.tabbar .scan{justify-self:center;width:54px;height:54px;padding:0;border-radius:50%;background:var(--navy);color:var(--white);justify-content:center;box-shadow:0 0 0 4px rgba(0,218,255,.35),0 8px 18px rgba(0,23,54,.3)}
.tabbar .scan svg{width:26px;height:26px}
.panel-glass{border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;color:var(--ink-muted)}
.field input[type=text]{background:rgba(255,255,255,.7);border:1px solid var(--glass-edge);border-radius:16px;padding:12px 14px;width:100%}
.verified{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.55);border-radius:16px;padding:10px 14px}
.verified b{font-weight:400}
.tick{color:var(--accent);font-size:13px;font-weight:400}
.selfie{display:flex;gap:14px;align-items:center}
.selfie input{position:absolute;opacity:0;width:1px;height:1px}
.selfie label.up{background:rgba(255,255,255,.7);border:1px solid var(--glass-edge);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;display:inline-block}
.selfie input:focus-visible+label.up{outline:2px solid var(--red);outline-offset:3px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{background:var(--sheen),var(--c);color:var(--f);border:0;border-radius:22px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:86px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.grp b{font-weight:600;font-size:15px;line-height:1.15;padding-right:24px}
.grp span{font-size:11px;opacity:.8}
.grp[aria-pressed="true"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 3px var(--white),0 0 0 5px var(--navy)}
.grp[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--navy);display:grid;place-items:center;font-size:12px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-muted)}
.consent input{accent-color:var(--ocean);margin-top:4px;width:16px;height:16px;flex:none}

.avatar{width:56px;height:56px;flex:none;background:var(--ocean);display:block;object-fit:cover;border-radius:50%}
.avatar.lg{width:140px;height:140px;border-radius:36px}
.hello{display:flex;gap:14px;align-items:center}
.progress{height:8px;border-radius:999px;margin-top:8px;overflow:hidden;padding:0}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ocean),var(--energy));transition:width .4s ease}
.stack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stack li+li{margin-top:-28px}
.zc{--c:#DCE3EA;--f:#33465C;width:100%;border:0;display:flex;align-items:flex-start;gap:12px;padding:18px 18px 46px;border-radius:30px;text-align:left;cursor:pointer;color:var(--f);background:var(--sheen),var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 -8px 22px rgba(0,23,54,.14);font-size:20px;font-weight:600;line-height:1.2}
.stack li:last-child .zc{padding-bottom:22px}
.zc .n{font-size:12px;font-weight:400;opacity:.7;padding-top:5px;width:20px;flex:none}
.zc .t{flex:1;min-width:0}
.zc small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:2px}
.zc .go{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:400;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.zc:disabled{cursor:default}
.zc.todo .go{opacity:.4}
.zc small.badge{display:table;background:#17824A;color:#fff;opacity:1;border-radius:999px;padding:2px 10px;margin-top:6px}
.zc.now small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.deck{position:relative;padding-top:18px}
.deck::before,.deck::after{content:"";position:absolute;top:0;left:18px;right:18px;height:48px;border-radius:26px 26px 0 0;background:var(--c3)}
.deck::after{top:9px;left:9px;right:9px;background:var(--c2)}
.panel{position:relative;z-index:1;background:var(--sheen),var(--c);color:var(--f);border-radius:30px;padding:20px 18px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 -6px 20px rgba(0,23,54,.14)}
.panel .desc{font-size:16px;font-weight:400;margin-bottom:4px}
.panel .item{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);border-radius:16px;padding:11px 14px;font-size:14px;color:inherit;text-align:left;width:100%}
.panel .save{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:400;min-height:60px}
.panel .save[aria-pressed="true"]{background:rgba(255,255,255,.85);color:var(--navy)}
.panel .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.link{background:none;border:0;padding:8px 0;font-size:14px;color:inherit;cursor:pointer}
.pill{background:rgba(255,255,255,.9);color:var(--navy);border:0;border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,23,54,.15)}
.card{border-radius:32px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px;text-align:center}
.card .logo{height:40px}
.stamps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stamp{font-size:12px;border-radius:999px;background:var(--c);color:var(--f);padding:4px 10px;font-weight:400}
.stamp.off{background:rgba(255,255,255,.5);color:var(--ink-muted);border:1px dashed var(--line-strong)}
.qr{width:200px;height:200px;background:var(--white);border-radius:18px;padding:10px}
.redeemed{background:rgba(255,255,255,.7);border-radius:16px;padding:12px;font-size:14px;width:100%}
.rows{display:flex;flex-direction:column;border-radius:24px;padding:4px 18px}
.rows div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(0,23,54,.08);padding:12px 0;font-size:14px}
.rows div:last-child{border-bottom:0}
.rows span{color:var(--ink-muted)}
.offer{border-radius:30px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;background:var(--sheen),var(--c,rgba(255,255,255,.44));color:var(--f,var(--ink))}
.offer .muted,.offer .label,.offer .tick{color:inherit;opacity:.85}
.offer .btn{background:rgba(255,255,255,.92);color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,23,54,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--white);border-radius:999px;padding:10px 18px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

/* ---------- staff console ---------- */
.console{max-width:1280px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.c-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.c-head .logo{height:40px}
.c-head h1{font-size:20px}
.live{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
.live i{width:8px;height:8px;background:var(--energy);display:block;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.c-tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{background:var(--white);border:1px solid var(--line-strong);padding:7px 10px}
.demo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--hot);color:var(--hot);padding:2px 8px;font-weight:400}
.c-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
.c-tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;font-size:14px;color:var(--ink-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.c-tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--energy);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);background:var(--white);border:1px solid var(--line)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tile:last-child{border-right:0}
@media (max-width:900px){.tile{border-bottom:1px solid var(--line)}}
.tile b{font-size:28px;font-weight:600;line-height:1.1}
.tile .d{font-size:12px;color:var(--accent)}
.box{background:var(--white);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:20px;margin-top:20px}
.g2{grid-template-columns:1.4fr 1fr}
@media (max-width:960px){.g2{grid-template-columns:1fr}}
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:120px 1fr 48px;gap:12px;align-items:center;font-size:13px}
.track{height:28px;background:var(--mist)}
.fill{height:100%;background:var(--sky);border-right:2px solid var(--energy);display:flex;align-items:center;padding-left:10px;font-weight:400;transition:width .4s ease}
.frow .rate{text-align:right;color:var(--accent)}
.split{display:flex;flex-direction:column;gap:14px}
.split .r{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.split .bar{grid-column:1/-1;height:6px;background:var(--mist)}
.split .bar i{display:block;height:100%;background:var(--ocean)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:400;color:var(--ink-muted);font-size:12px;white-space:nowrap}
.heat td.c{text-align:center;min-width:64px}
.temp{font-size:11px;padding:2px 8px;border:1px solid;font-weight:400;text-transform:capitalize;white-space:nowrap}
.temp.hot{color:var(--hot);border-color:var(--hot)}
.temp.warm{color:var(--warm);border-color:var(--warm)}
.temp.cold{color:var(--cold);border-color:var(--cold)}
.lead-av{width:28px;height:28px;vertical-align:middle;margin-right:8px;display:inline-block}
.viewfinder{position:relative;align-self:center;width:min(100%,300px);aspect-ratio:1;border-radius:40px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#194776,#001736);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 16px 40px rgba(0,23,54,.3)}
.viewfinder .qr{width:56%;height:auto;outline:3px solid var(--energy);outline-offset:14px}
.viewfinder i{position:absolute;left:14%;right:14%;top:16%;height:2px;background:var(--energy);box-shadow:0 0 14px 2px var(--energy);animation:scanline 2.4s ease-in-out infinite alternate}
@keyframes scanline{to{top:84%}}
.qrbox{align-items:center;text-align:center}
.qrbox .qr{width:220px;height:220px;border:1px solid var(--line);padding:10px;background:var(--white)}
.vh{position:absolute;opacity:0;width:1px;height:1px}
.vh:focus-visible+label{outline:2px solid var(--energy);outline-offset:2px}
.tabbar .scan[aria-current="page"]{background:var(--navy);color:var(--white);box-shadow:0 0 0 4px var(--energy),0 8px 18px rgba(0,23,54,.3)}
.scanner{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans)}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .vf{position:relative;width:min(70vw,280px);aspect-ratio:1;border:3px solid var(--energy);border-radius:32px;box-shadow:0 0 0 100vmax rgba(0,23,54,.55);overflow:hidden}
.scanner .vf i{position:absolute;left:8%;right:8%;top:10%;height:2px;background:var(--energy);box-shadow:0 0 14px 2px var(--energy);animation:scanline 2.4s ease-in-out infinite alternate}
.scanner .hint{position:relative;margin-top:20px;font-size:15px;text-align:center;padding:0 24px;max-width:420px}
.scanner .bar{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;max-width:480px;margin:0 auto}
.scanner .bar .btn{border-radius:999px;font-weight:400;padding:13px 8px;cursor:pointer}
.scanner .btn.ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.scanner :focus-visible{outline:2px solid var(--energy);outline-offset:3px}
.zqr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}

.zqr .qr{width:140px;height:140px;border:1px solid var(--line)}
/* responsive: the phone layout is the base; tablets widen the column, desktop splits headline | content */
.app{max-width:none}
.appbar,.screen,.actions{width:100%;max-width:560px;margin-inline:auto}
.lead,.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.tabbar{width:min(calc(100% - 32px),420px);margin:0 auto 12px}
@media (hover:hover){.zc:not(:disabled):hover,.grp:hover,.app .btn:not(:disabled):hover{filter:brightness(1.08)}}
@media (min-width:720px){
  .appbar,.screen,.actions{max-width:720px}

  .hero{font-size:52px}.hero.xl{font-size:68px}

}

  .lead{position:sticky;top:96px}
  .actions{display:grid;grid-template-columns:5fr 6fr;column-gap:64px}
  .actions .btn{grid-column:2}

  .groups{grid-template-columns:1fr 1fr}
  .card{max-width:480px}
}
.simscan{border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:8px}
.simrow{display:flex;gap:8px}
.simrow select{flex:1;min-width:0;border-radius:999px;padding:10px 14px;border:1px solid var(--glass-edge);background:rgba(255,255,255,.85)}
.app .simrow .btn{width:auto;padding-inline:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// RFC 4180-ish: quoted fields may hold commas, quotes ("") and newlines
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
// order matters: a ministry analyst is gov, an engineering student is talent
const groupFor=(title,company)=>{const s=(title+" "+company).toLowerCase();
  return /student|universit|intern|graduate|research|lecturer|professor/.test(s)?"talent":/ministry|government|regulat|department|dmf|authority|agency/.test(s)?"gov":/engineer|geolog|geophys|technical|scientist|specialist|analyst/.test(s)?"tech":"dm"};
function importLeads(text){
  const [head,...rows]=parseCSV(String(text).replace(/^﻿/,""));const h=(head||[]).map(x=>x.trim().toLowerCase());
  const col=(...n)=>h.findIndex(x=>n.includes(x));
  const ci={name:col("name","full name","full_name"),company:col("company","organization","organisation"),title:col("job_title","job title","title"),email:col("email"),badge:col("badge","badge_id","badge id")};
  if(ci.name<0){toast("No name column in this file");return}
  // shortcut: 500-row cap per upload, raise or page it if one export is bigger
  const add=rows.slice(0,500).map((r,j)=>{const g=k=>ci[k]<0?"":(r[ci[k]]||"").trim().slice(0,80);
    return{name:g("name"),company:g("company"),title:g("title"),email:g("email"),badge:g("badge")||"IPTC27-"+String(Date.now()+j).slice(-6),in:false}}).filter(p=>p.name);
  add.forEach(p=>p.group=groupFor(p.title,p.company));
  PROFILES=[...add,...PROFILES.filter(o=>!add.some(p=>p.badge===o.badge))];QRP=add.length?0:QRP;
  toast(`${add.length} profiles generated`);CT="import";renderConsole();
}
function login(p){p.in=true;Object.assign(S,{name:p.name,company:p.company,title:p.title,badge:p.badge,group:p.group,step:"create",tab:"route",zone:null,consent:false,photo:null,visited:[],saved:[],redeemed:false,offerTaken:false})}
function importView(){
  const rows=PROFILES.map((p,i)=>[p,i]).filter(([p])=>CG==="all"||p.group===CG),p=PROFILES[QRP];
  return `<div class="grid g2" style="margin-top:0"><div class="box"><div class="box-h"><h2>1 · Upload lead export</h2><span class="small muted num">${PROFILES.length} profiles</span></div>
  <p class="small muted">CSV from the lead capture app with name, company, job_title, email, badge. Each row becomes a visitor profile; the group is matched from job title.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input type="file" id="f-csv" class="vh" accept=".csv,text/csv"><label class="btn sm" for="f-csv" style="cursor:pointer">Upload CSV</label><button class="btn sm ghost" id="go-sample">Load sample export</button></div>
  <div class="scroll"><table><thead><tr><th>Visitor</th><th>Company</th><th>Job title</th><th>Group</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(([p,i])=>`<tr><td style="white-space:nowrap"><img class="lead-av" src="${avatarSrc(p.name,null)}" alt="">${esc(p.name)}</td><td>${esc(p.company)}</td><td>${esc(p.title)}</td><td>${GROUPS[p.group].name}</td><td>${p.in?'<span class="temp hot">Logged in</span>':'<span class="temp warm">QR ready</span>'}</td><td><button class="btn sm ghost" data-qr="${i}" ${i===QRP?'aria-current="true"':""}>Show QR</button></td></tr>`).join("")||`<tr><td colspan="6" class="muted">No profiles yet. Upload a lead export.</td></tr>`}
  </tbody></table></div></div>
  <div class="box qrbox">${p?`<h2>2 · Profile QR</h2><svg class="qr" viewBox="0 0 21 21" role="img" aria-label="Login QR for ${esc(p.name)}">${qr(loginUrl(p))}</svg><div><b style="font-weight:400">${esc(p.name)}</b><p class="small muted">${esc(p.company)} · ${GROUPS[p.group].name}</p></div><p class="small muted">Show this on the booth screen. The visitor scans it with their phone camera to open their profile.</p><a class="small" href="${esc(loginUrl(p))}" target="_blank" rel="noopener">Open this profile in the visitor app ↗</a>`
    :`<h2>2 · Profile QR</h2><p class="muted">Upload leads, then pick Show QR on a profile.</p>`}</div></div>`;
}

/* ---------- in-page camera scanner: station staff read the QR on a visitor's My card ---------- */
// shortcut: the QR carries the profile itself so any staff device can read it; swap for a one-time token URL before real visitor data goes in it
// visitor-app/ and staff-console/ sit side by side, so the console links to ../visitor-app/
const SITE_ROOT=new URL("../",location.href).href,VISITOR_URL=SITE_ROOT+"visitor-app/";
const qs=p=>new URLSearchParams({b:p.badge,n:p.name,c:p.company,t:p.title,g:p.group});
const loginUrl=p=>VISITOR_URL+"?"+qs(p);
// real path per profile, served on GitHub Pages through the site-root 404.html
// shortcut: the details ride in the #fragment (never sent to a server); drop them once a backend can look the id up
const cardUrl=p=>SITE_ROOT+"profile/"+encodeURIComponent(p.badge)+"#"+new URLSearchParams({n:p.name,c:p.company,t:p.title,g:p.group});
let CAM=null,SCAN=null;
function readQR(src,w,h){const r=jsQR(src,w,h);return r&&r.data}
async function openScanner(read,sim){
  if($("scanner"))return;
  SCAN={read,sim};
  const el=document.createElement("div");el.className="scanner";el.id="scanner";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Scan visitor card");
  el.innerHTML=`<video playsinline muted aria-hidden="true"></video><div class="vf" aria-hidden="true"><i></i></div><p class="hint" role="status">Opening camera…</p>
  <div class="bar"><button class="btn ghost" id="sc-close">Cancel</button><input type="file" id="sc-photo" class="vh" accept="image/*" capture="environment"><label class="btn ghost" for="sc-photo">Take photo</label><button class="btn" id="sc-sim">Simulate</button></div>`;
  document.body.append(el);$("sc-close").focus();
  const v=el.querySelector("video"),hint=el.querySelector(".hint");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    if(!$("scanner")){stream.getTracks().forEach(t=>t.stop());return} // cancelled while the browser asked
    CAM=stream;v.srcObject=stream;await v.play();hint.textContent="Point at the QR on the visitor's My card";
    const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
    const tick=()=>{if(!CAM)return;
      if(v.readyState>=2&&v.videoWidth){const w=c.width=Math.min(v.videoWidth,720),h=c.height=Math.round(v.videoHeight*w/v.videoWidth);x.drawImage(v,0,0,w,h);
        const d=readQR(x.getImageData(0,0,w,h).data,w,h);if(d){const f=SCAN.read;closeScanner();f(d);return}}
      requestAnimationFrame(tick)};
    tick();
  }catch(err){hint.textContent="Live camera is blocked here. Tap Take photo to use the device camera."}
}
function closeScanner(){if(CAM){CAM.getTracks().forEach(t=>t.stop());CAM=null}SCAN=null;const el=$("scanner");if(el)el.remove()}
function readPhoto(file){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);const w=Math.min(img.naturalWidth,1280),h=Math.round(img.naturalHeight*w/img.naturalWidth),c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.drawImage(img,0,0,w,h);const d=readQR(x.getImageData(0,0,w,h).data,w,h);
    if(d&&SCAN){const f=SCAN.read;closeScanner();f(d)}else{const hint=document.querySelector("#scanner .hint");if(hint)hint.textContent="No QR code found in that photo. Try again, closer."}};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Could not read that image")};
  img.src=url;
}
function simulateLogin(){const p=PROFILES.find(p=>!p.in);if(p)login(p);else S.step="create";render();toast("Profile found")}
// QR text is untrusted: accept only our card/login URL, clip lengths; everything shown goes through esc()
function parseVisitor(text){
  let u=null;try{u=new URL(String(text).trim())}catch(e){}
  if(!u||!/^https?:$/.test(u.protocol))return null;
  // card QR: <site>/profile/<id>#details · after the 404 redirect: ?profile=<id>#details · login QR: ?b=<id>&n=…
  let id=null;const m=u.pathname.match(/\/profile\/([^/]+)\/?$/);try{id=m?decodeURIComponent(m[1]):u.searchParams.get("profile")}catch(e){}
  const P=id?new URLSearchParams(u.hash.slice(1)):u.searchParams,q=k=>(P.get(k)||"").slice(0,80),b=(id||q("b")).slice(0,40);
  if(!b)return null;
  return{badge:b,name:q("n")||"Visitor",company:q("c"),title:q("t"),group:GROUPS[q("g")]?q("g"):"dm"};
}
const STATIONS=Object.keys(ZONES).filter(z=>z!=="Reception");
let ST="Worldwide Operation",LAST=null,SCANS=[];
function onStaffScan(text){
  const v=parseVisitor(text);if(!v){toast("Not a PTTEP visitor card");return}
  // shortcut: the check-in is only logged on this device; a shared backend is needed to update the visitor's own app
  const me=false,res=ST==="Redeem"?"Gift handed over":`Checked in at ${ST}`;
  const t=new Date().toTimeString().slice(0,5);
  LAST={...v,res,me,t};SCANS=[LAST,...SCANS].slice(0,50);
  CT="station";renderConsole();toast(res);
}
function simStaffScan(){onStaffScan(cardUrl(PROFILES[0]||S))}
function stationView(){
  const L=LAST,g=L&&GROUPS[L.group];
  const info=L?`<div class="hello"><img class="avatar" src="${avatarSrc(L.name,null)}" alt="" style="border-radius:0"><div><h2>${esc(L.name)}</h2><p class="small muted">${esc([L.company,L.title].filter(Boolean).join(" · "))}</p></div></div>
    <p class="tick" style="font-size:15px">✓ ${esc(L.res)}</p>
    <div class="rows" style="padding:0"><div><span>Group</span><b>${g.name}</b></div><div><span>Badge</span><b class="num">${esc(L.badge)}</b></div>
    ${L.me?`<div><span>Route</span><b class="num">${S.visited.length} of ${route().length} zones</b></div><div><span>Saved topics</span><b>${S.saved.length?esc(S.saved.join(", ")):"None yet"}</b></div><div><span>Gift</span><b>${S.redeemed?"Collected":"Not yet"}</b></div>`:""}</div>
    <p class="small muted">Talking points: ${g.view} · offer “${g.offer}”.</p>`
    :`<p class="muted">Scan a visitor's My card. Their details show here.</p>`;
  return `<div class="grid g2" style="margin-top:0"><div class="box"><div class="box-h"><h2>Station scan</h2></div>
  <p class="small muted">Scan the QR on a visitor's My card. It checks them in at this station and shows who they are. The camera opens inside this page.</p>
  <div class="field"><label for="f-station">This station</label><select id="f-station">${STATIONS.map(z=>`<option ${z===ST?"selected":""}>${esc(z)}</option>`).join("")}</select></div>
  <button class="btn" data-act="staff-scan">Scan visitor card</button></div>
  <div class="box">${L?`<div class="box-h"><h2>Visitor</h2><span class="small muted num">${L.t}</span></div>`:"<h2>Visitor</h2>"}${info}</div></div>
  <div class="grid"><div class="box"><div class="box-h"><h2>Scans at this booth</h2><span class="small muted num">${SCANS.length}</span></div><div class="scroll"><table><thead><tr><th>Time</th><th>Visitor</th><th>Company</th><th>Group</th><th>Result</th></tr></thead><tbody>
  ${SCANS.map(s=>`<tr><td class="num">${s.t}</td><td>${esc(s.name)}</td><td>${esc(s.company)}</td><td>${GROUPS[s.group].name}</td><td>${esc(s.res)}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No scans yet.</td></tr>`}
  </tbody></table></div></div></div>`;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("scanner"))closeScanner()});

renderConsole();
</script>

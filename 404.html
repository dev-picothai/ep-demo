<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTTEP Digital Twin</title>
<script>
// GitHub Pages serves this file for any unknown path; send <site>/profile/<id>#details to the visitor app's profile page
var m=location.pathname.match(/^(.*)\/profile\/([^\/]+)\/?$/);
if(m)location.replace(m[1]+"/visitor-app/?profile="+m[2]+location.hash);
</script></head>
<body style="font-family:system-ui,sans-serif;padding:24px;color:#001736"><p>Page not found.</p></body></html>
